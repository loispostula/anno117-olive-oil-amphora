name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      zip: ${{ steps.package.outputs.zip }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - id: package
        run: |
          zip=$(python tools/package.py)
          echo "zip=$(basename "$zip")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .Version mod/modinfo.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check tag matches modinfo version
        if: github.ref_name != format('v{0}', needs.build.outputs.version)
        run: |
          echo "::error::tag ${{ github.ref_name }} does not match modinfo Version ${{ needs.build.outputs.version }}"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: mod-zip
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Re-runnable: a re-run (e.g. after adding mod.io secrets) replaces the asset.
        run: |
          zip="dist/${{ needs.build.outputs.zip }}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
          fi
      - name: Upload to mod.io
        if: vars.MODIO_GAME_ID != '' && vars.MODIO_MOD_ID != ''
        # v3.0.0
        uses: nickelc/upload-to-modio@48cc22afe94d0d93083ba6f49946cef1090153a2
        with:
          token: ${{ secrets.MODIO_TOKEN }}
          game: ${{ vars.MODIO_GAME_ID }}
          mod: ${{ vars.MODIO_MOD_ID }}
          path: dist/${{ needs.build.outputs.zip }}
          version: ${{ needs.build.outputs.version }}
          active: true
